<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="t d">
<title id="t">小狗的小屋功能位置示意</title><desc id="d">原创建模的小屋界面结构，标明音乐舞池、专注搭子、惊喜表情、每日作息、状态卡与导入本地素材按钮。无第三方角色形象。</desc>
<rect width="1120" height="660" rx="25" fill="#0f1929"/>
<text x="38" y="53" font-family="Arial,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#f8fbff">小狗的小屋 · 主要按钮在哪里？</text>
<text x="38" y="83" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#abbed4">结构与当前 src/panel.html 对应；此图是原创建模的布局示意，不是实际截图。</text>
<g transform="translate(38 105)">
