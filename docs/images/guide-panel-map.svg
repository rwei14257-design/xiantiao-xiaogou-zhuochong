<rect x="28" y="178" width="312" height="94" rx="14" fill="#d7e8f8"/><rect x="366" y="178" width="312" height="94" rx="14" fill="#d7e8f8"/><rect x="704" y="178" width="312" height="94" rx="14" fill="#d7e8f8"/>
<g font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#23517f"><text x="54" y="214">01 音乐舞池</text><text x="392" y="214">02 专注搭子</text><text x="730" y="214">03 惊喜表情</text></g>
