appId: local.puppy.companion.code
productName: Puppy Companion
copyright: Copyright © 2026 rwei14257-design and contributors
asar: true
directories:
  output: dist
files:
  - src/**/*
  - "!src/smoke-test.js"
  - package.json
  - LICENSE
  - NOTICE.md
  - ASSET_POLICY.md
  - THIRD_PARTY_NOTICES.md
  - "!assets-local/**/*"
  - "!artifacts/**/*"
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Puppy-Companion-${version}-Windows-${arch}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 线条小狗桌宠
  deleteAppDataOnUninstall: false
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.lifestyle
  artifactName: Puppy-Companion-${version}-macOS-${arch}.${ext}
  identity: "-"
  hardenedRuntime: false
  notarize: false
dmg:
  title: Puppy Companion
publish: null
